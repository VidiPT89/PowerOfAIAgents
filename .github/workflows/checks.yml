name: Checks
on:
  push:
  pull_request:
jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test on macOS
        run: xcodebuild -project PowerOfAIAgents.xcodeproj -scheme PowerOfAIAgents-macOS -destination 'platform=macOS' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO test
      - name: Build iOS
        run: xcodebuild -project PowerOfAIAgents.xcodeproj -scheme PowerOfAIAgents -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build
